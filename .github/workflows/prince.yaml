name: myworkflow1
on:
  push:
    branches:
      - princebranch
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cd
          ls -al
      - name: mystep2-clone the repo
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-build the docker image
        run: docker build -t princepanwar21032011/myimage_nov_3:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5-check the docker image
        run: docker image ls
      - name: mystep6-login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}
